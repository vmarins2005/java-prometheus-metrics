global:
  # Quinze segundos entre raspagens. Este numero e o piso da sua resolucao: um pico de cinco
  # segundos simplesmente nao existe para o Prometheus.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: servico
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["servico:8080"]
